name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Jest (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  frontend-unit:
    name: Vitest (frontend unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

  e2e:
    name: Playwright (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork PRs cannot read repo secrets — skip the job rather than fail opaquely.
    # Do NOT reference secrets in this if. The secrets context is illegal in a
    # job-level if, and GitHub then rejects the whole workflow with zero jobs
    # (backend and frontend included). Missing secrets are skipped in a step below.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      PLAYWRIGHT_API_URL: ${{ secrets.PLAYWRIGHT_API_URL }}
      PLAYWRIGHT_USERNAME: ${{ secrets.PLAYWRIGHT_USERNAME }}
      PLAYWRIGHT_PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Job env already maps the four secrets. An empty one means "skip", not "fail",
      # so Jest and Vitest remain the merge gate until Playwright is configured.
      - name: Skip Playwright when secrets are unset
        id: playwright
        run: |
          missing=0
          for var in PLAYWRIGHT_BASE_URL PLAYWRIGHT_API_URL PLAYWRIGHT_USERNAME PLAYWRIGHT_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "$var is unset"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Playwright secrets are unset — skipping e2e."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.playwright.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.playwright.outputs.run == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        if: steps.playwright.outputs.run == 'true'
        run: npm run e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
